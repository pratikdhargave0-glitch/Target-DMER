<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MPSC Target - Practice Test</title>
<style>
body{font-family:Arial;background:#f1f4f9;margin:0;color:#172033}
header{background:#142d55;color:white;padding:22px;text-align:center}
.container{max-width:700px;margin:25px auto;padding:20px}
.card{background:white;padding:22px;border-radius:12px;box-shadow:0 3px 12px #ccd2dc}
button{padding:12px 18px;border:0;border-radius:7px;background:#174b91;color:white;margin:5px;cursor:pointer}
.option{display:block;width:100%;text-align:left;background:#edf2fa;color:#172033;margin:10px 0}
.option.selected{background:#c8ddff;border:2px solid #174b91}
#timer{font-weight:bold;color:#c0392b}
</style>
</head>
<body>
<header>
<h1>MPSC TARGET</h1>
<p>Practice • Improve • Succeed</p>
</header>
<div class="container">
<div class="card">
<h3>General Studies - Practice Test</h3>
<p>Questions: 10 | Marks: 10 | Time: <span id="timer">30:00</span></p>
<hr>
<h3 id="question"></h3>
<div id="options"></div>
<p id="progress"></p>
<button onclick="previous()">Previous</button>
<button onclick="next()">Next</button>
<button onclick="submitTest()">Submit Test</button>
<div id="result"></div>
</div>
</div>
<script>
const questions=[
{q:"Who is known as the Father of the Indian Constitution?",o:["Mahatma Gandhi","Dr. B. R. Ambedkar","Jawaharlal Nehru","Sardar Patel"],a:1,e:"Dr. B. R. Ambedkar was Chairman of the Drafting Committee."},
{q:"When did the Indian Constitution come into force?",o:["15 August 1947","26 November 1949","26 January 1950","2 October 1950"],a:2,e:"The Constitution came into force on 26 January 1950."},
{q:"Which is the largest state of India by area?",o:["Maharashtra","Madhya Pradesh","Rajasthan","Uttar Pradesh"],a:2,e:"Rajasthan is the largest Indian state by area."},
{q:"Who was the first President of India?",o:["Dr. Rajendra Prasad","S. Radhakrishnan","Zakir Hussain","V. V. Giri"],a:0,e:"Dr. Rajendra Prasad was India's first President."},
{q:"Where is the headquarters of RBI?",o:["Delhi","Mumbai","Kolkata","Chennai"],a:1,e:"The Reserve Bank of India headquarters is in Mumbai."},
{q:"Which river is known as Dakshin Ganga?",o:["Krishna","Godavari","Kaveri","Narmada"],a:1,e:"Godavari is popularly known as Dakshin Ganga."},
{q:"Who founded the Satyashodhak Samaj?",o:["B. R. Ambedkar","Jyotiba Phule","Gopal Krishna Gokhale","Bal Gangadhar Tilak"],a:1,e:"Jyotiba Phule founded it in 1873."},
{q:"What is the minimum age to become a Lok Sabha member?",o:["21 years","25 years","30 years","35 years"],a:1,e:"The minimum age is 25 years."},
{q:"Which gas is absorbed by plants during photosynthesis?",o:["Oxygen","Nitrogen","Carbon dioxide","Hydrogen"],a:2,e:"Plants absorb carbon dioxide during photosynthesis."},
{q:"Which is the highest peak in Maharashtra?",o:["Kalsubai","Salher","Harishchandragad","Mahabaleshwar"],a:0,e:"Kalsubai is the highest peak in Maharashtra."}
];
let current=0,answers={},finished=false,remaining=1800;
function show(){
if(finished)return;
let q=questions[current];
document.getElementById("question").innerText=(current+1)+". "+q.q;
document.getElementById("options").innerHTML=q.o.map((x,i)=>`<button class="option ${answers[current]===i?'selected':''}" onclick="choose(${i})">${String.fromCharCode(65+i)}. ${x}</button>`).join("");
document.getElementById("progress").innerText="Question "+(current+1)+" of "+questions.length;
}
function choose(i){if(finished)return;answers[current]=i;show()}
function next(){if(current<questions.length-1){current++;show()}}
function previous(){if(current>0){current--;show()}}
function submitTest(){
if(finished)return;
if(!confirm("Are you sure you want to submit the test?"))return;
finished=true;clearInterval(clock);
let score=questions.filter((q,i)=>answers[i]===q.a).length;
document.getElementById("question").innerText="Test Completed!";
document.getElementById("options").innerHTML="";
document.getElementById("progress").innerText="";
document.getElementById("result").innerHTML=`<h2>Your Score: ${score}/10</h2><h3>Answer Review</h3>`+questions.map((q,i)=>`<p><b>${i+1}. ${q.q}</b><br>Your answer: ${answers[i]===undefined?"Not attempted":q.o[answers[i]]}<br>Correct answer: ${q.o[q.a]}<br><small>${q.e}</small></p>`).join("");
}
const clock=setInterval(()=>{
if(finished)return;
remaining--;
document.getElementById("timer").innerText=String(Math.floor(remaining/60)).padStart(2,"0")+":"+String(remaining%60).padStart(2,"0");
if(remaining<=0)submitTest();
},1000);
show();
</script>
</body>
</html>
